# ======================================================
# Secure Multi-User Pool Router (Smart Fallback Chain)
# ------------------------------------------------------
# Primary backend:  /home/<user>/www/<domain>.sock
# Dynamic fallback: /home/nginx/www/localhost/
# Static fallback:  /usr/share/nginx/html
# ======================================================

server {
    listen 8082 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 8444 ssl default_server;
    listen 8444 quic reuseport;
    http2 on;

    server_name _;

    ssl_certificate     /etc/letsencrypt/live/pool.glitchr.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pool.glitchr.dev/privkey.pem;

    access_log /var/log/nginx/pool_access.log;
    error_log  /var/log/nginx/pool_error.log;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;

    # ======================================================
    # Avoid crawlers
    # ======================================================
    location = /robots.txt {
        default_type text/plain;
        if ($host ~* \.pool\.glitchr\.dev$) {
            return 200 "User-agent: *\nDisallow: /\n";
        }
    }

    # ======================================================
    # Common variables
    # ======================================================
    set $user "";
    if ($host ~* ^([^.]+)\.pool\.glitchr\.dev$) { set $user $1; }
    if ($host ~* ^([^.]+)\.localhost$) { set $user $1; }
    if ($user_override != "") { set $user $user_override; }
    if ($user = "") { set $user nginx; }

    if ($uri ~* ^/([^/]+)/?) {
        set $domain $1;
    }
    if ($domain = "") {
        set $domain $host;
    }
    # Build userland path
    set $userland /home/$user/www/$domain;
    set $nginx    /home/nginx/www/localhost;

    set $lock_path $userland.lock;
    set $sock_path $userland.sock;
    set $php_root  $userland;
    set $html_root $userland;

    location ~ ^/([^/]+)/whoami$ {
        default_type text/plain;

        return 200 "User: $user; Domain: $domain\n";
    }

    # ======================================================
    # Dispatcher — ordered discovery chain
    # ======================================================
    location / {

        # (1) site locked
        if (-f $lock_path) { return 403; }

        # (2) userland lookups
        if (-e $sock_path)                    { return 590; }
        if (-f $php_root/current/index.php)   { return 591; }
        if (-f $php_root/public/index.php)    { return 591; }
        if (-f $php_root/index.php)           { return 591; }
        if (-f $html_root/current/index.html) { return 592; }
        if (-f $html_root/public/index.html)  { return 592; }
        if (-f $html_root/index.html)         { return 592; }

        # (3) NGINX fallback only if userland != nginx
        set $sock_path $nginx.sock;
        set $php_root  $nginx;
        set $html_root $nginx;

        if (-e $sock_path)                    { return 593; }
        if (-f $php_root/current/index.php)   { return 591; }
        if (-f $php_root/public/index.php)    { return 591; }
        if (-f $php_root/index.php)           { return 591; }
        if (-f $html_root/current/index.html) { return 592; }
        if (-f $html_root/public/index.html)  { return 592; }
        if (-f $html_root/index.html)         { return 592; }

        # (4) global static fallback
        if (-d /usr/share/nginx/html) { return 594; }

        # (5) none found
        return 404;
    }

    # ======================================================
    # 590 User socket proxy
    # ======================================================
    error_page 590 = @sock_fallback;
    location @sock_fallback {
        proxy_pass http://unix:$sock_path:;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_intercept_errors on;
        error_page 502 503 504 = @php_fallback;
    }

    # ======================================================
    # 591 PHP Fallback (userland or nginx)
    # ======================================================
    error_page 591 = @php_fallback;
    location @php_fallback {
        # Normalize structure
        if (-d $php_root/public)  { set $php_root $php_root/public; }
        if (-d $php_root/current) { set $php_root $php_root/current; }

        include fastcgi_params;

        # Force static target
        fastcgi_param SCRIPT_FILENAME $php_root/index.php;
        fastcgi_param SCRIPT_NAME     /index.php;
        fastcgi_param DOCUMENT_ROOT   $php_root;

        fastcgi_index index.php;
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_intercept_errors on;
        fastcgi_read_timeout 60s;

        error_page 502 503 504 = @html_fallback;
    }

    # ======================================================
    # 592 HTML fallback (userland or nginx)
    # ======================================================
    error_page 592 = @html_fallback;
    location @html_fallback {
        if (-d $html_root/public) { set $html_root $html_root/public; }
        if (-d $html_root/current) { set $html_root $html_root/current; }
        root $html_root;
        try_files /index.html =404;
    }

    # ======================================================
    # 593 Nginx dynamic socket fallback
    # ======================================================
    error_page 593 = @dynamic_fallback;
    location @dynamic_fallback {
        proxy_pass http://unix:/home/nginx/www/localhost.sock:;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_intercept_errors on;
        error_page 502 503 504 = @static_fallback;
    }

    # ======================================================
    # 594 Global static fallback (/usr/share/nginx/html)
    # ======================================================
    error_page 594 = @static_fallback;
    location @static_fallback {
        if (!-d /usr/share/nginx/html) { return 404; }
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }
}
