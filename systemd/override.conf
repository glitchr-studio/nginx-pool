# Installed by nginx-pool: `make automation`. Do not edit in place.
#
# The nginx.org unit ships no restart policy at all, so a single failed
# ExecStart leaves the entire hosting pool down until a human notices.
# On 2026-09-08 an unresolvable LAN upstream in a reverse-proxy vhost made
# nginx refuse to start at boot and every vhost stayed down for 7 hours.

[Unit]
# Never give up. The usual cause of a failed start is a dependency that is
# merely late (LAN DNS at boot), so the default "5 tries then stop trying"
# turns a transient problem into a permanent outage.
StartLimitIntervalSec=0

[Service]
Restart=on-failure
RestartSec=10s
